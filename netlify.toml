[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/web/search-data.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/web/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
