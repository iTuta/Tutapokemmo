name: 明雷报点推送

on:
  # 仅由外部定时服务（cron-job.org）通过 workflow_dispatch 触发，避免与 GitHub schedule 重复报点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swarm-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 检查报点并推送
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SWARM_ONLY_VALUABLE: ${{ vars.SWARM_ONLY_VALUABLE }}
          SWARM_REGIONS: ${{ vars.SWARM_REGIONS }}
          SWARM_MONSTER_IDS: ${{ vars.SWARM_MONSTER_IDS }}
        run: node scripts/qq-push/index.js --once

      - name: 保存已推送记录
        run: |
          git config user.name "swarm-push[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/qq-push/seen.json scripts/qq-push/pending.json scripts/qq-push/boss-last.json
          if git diff --cached --quiet; then
            echo "已推送记录无变化，跳过提交"
          else
            git commit -m "chore: 更新明雷推送记录"
            git pull --rebase origin main --autostash || true
            git push
          fi
