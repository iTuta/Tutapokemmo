name: 明雷报点推送

on:
  # 仅由外部定时服务（cron-job.org）通过 workflow_dispatch 触发，避免与 GitHub schedule 重复报点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swarm-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: 安装 Playwright（真浏览器过 CF 挑战兜底）
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: 检查报点并推送
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          SWARM_ONLY_VALUABLE: ${{ vars.SWARM_ONLY_VALUABLE }}
          SWARM_REGIONS: ${{ vars.SWARM_REGIONS }}
          SWARM_MONSTER_IDS: ${{ vars.SWARM_MONSTER_IDS }}
        run: node scripts/qq-push/index.js --once

      - name: 保存已推送记录
        run: |
          git config user.name "swarm-push[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 每类文件单独 add：git add 在任一 pathspec 无匹配时会整体失败（全有或全无）
          git add -f scripts/qq-push/seen.json scripts/qq-push/pending.json scripts/qq-push/boss-last.json scripts/qq-push/swarm-status.json 2>/dev/null || true
          git add -f scripts/qq-push/debug-*.txt 2>/dev/null || true
          git add -f scripts/qq-push/debug-*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "已推送记录无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新明雷推送记录"
          # 与并发运行（手动 dispatch 撞上 cron）可能提交相同文件：冲突以远端为准，重试 3 次
          for i in 1 2 3; do
            if git pull --rebase -X ours origin main --autostash >/dev/null 2>&1 && git push; then
              echo "已提交推送记录"
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 5
          done
          echo "推送记录提交失败（远端并发冲突），本轮消息已发出，记录下轮重建"
          exit 0
