name: 明雷报点推送

on:
  schedule:
    # GitHub Actions 定时任务最短间隔为 5 分钟（UTC 时间）
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swarm-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 检查报点并推送
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          SWARM_ONLY_VALUABLE: ${{ vars.SWARM_ONLY_VALUABLE }}
          SWARM_REGIONS: ${{ vars.SWARM_REGIONS }}
          SWARM_MONSTER_IDS: ${{ vars.SWARM_MONSTER_IDS }}
        run: node scripts/qq-push/index.js --once

      - name: 保存已推送记录
        run: |
          git config user.name "swarm-push[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qq-push/seen.json scripts/qq-push/pending.json
          if git diff --cached --quiet; then
            echo "已推送记录无变化，跳过提交"
          else
            git commit -m "chore: 更新明雷推送记录"
            git push
          fi
